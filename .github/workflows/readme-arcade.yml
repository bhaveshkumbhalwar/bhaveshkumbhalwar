name: README Arcade

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate arcade SVG
        uses: ECD5A/README-Arcade@v1
        with:
          user: ${{ github.repository_owner }}
          mode: snake
          speed: normal
          output-dir: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated arcade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "chore(profile): refresh README arcade [skip ci]"
          git push
