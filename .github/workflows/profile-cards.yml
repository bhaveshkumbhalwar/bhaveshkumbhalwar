name: Update Profile Cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render self-hosted profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,languages,contributions,rhythm
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh GitHub stats [skip ci]"

      - name: Generate self-hosted trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=algolia&column=7&margin-w=10&margin-h=10&no-bg=true&no-frame=true'
          path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git diff --cached --quiet || git commit -m "chore(profile): refresh GitHub trophies [skip ci]"
          git push
